name: Terraform Apply

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_STATE_KEY: voting-app/terraform.tfstate
  TF_VAR_environment: dev

concurrency:
  group: terraform-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-staging:
    name: Apply on staging
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate backend config vars
        run: |
          if [[ -z "${{ vars.TF_STATE_BUCKET }}" ]]; then
            echo "Repository variable TF_STATE_BUCKET is required"; exit 1
          fi
          if [[ -z "${{ vars.TF_LOCK_TABLE }}" ]]; then
            echo "Repository variable TF_LOCK_TABLE is required"; exit 1
          fi

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        env:
          TF_VAR_environment: ${{ env.TF_VAR_environment }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform -chdir=terraform apply -input=false -auto-approve

  apply-main:
    name: Apply on main
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate backend config vars
        run: |
          if [[ -z "${{ vars.TF_STATE_BUCKET }}" ]]; then
            echo "Repository variable TF_STATE_BUCKET is required"; exit 1
          fi
          if [[ -z "${{ vars.TF_LOCK_TABLE }}" ]]; then
            echo "Repository variable TF_LOCK_TABLE is required"; exit 1
          fi

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        env:
          TF_VAR_environment: ${{ env.TF_VAR_environment }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform -chdir=terraform apply -input=false -auto-approve
