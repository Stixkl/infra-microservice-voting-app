name: Terraform Validate

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_STATE_KEY: voting-app/terraform.tfstate
  TF_VAR_environment: dev

jobs:
  validate-plan:
    name: Terraform format, validate and plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate backend config vars
        run: |
          if [[ -z "${{ vars.TF_STATE_BUCKET }}" ]]; then
            echo "Repository variable TF_STATE_BUCKET is required"; exit 1
          fi
          if [[ -z "${{ vars.TF_LOCK_TABLE }}" ]]; then
            echo "Repository variable TF_LOCK_TABLE is required"; exit 1
          fi

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        env:
          TF_VAR_environment: ${{ env.TF_VAR_environment }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform -chdir=terraform plan -input=false -no-color -out=tfplan

      - name: Publish plan summary
        run: |
          terraform -chdir=terraform show -no-color tfplan > plan.txt
          {
            echo "## Terraform Plan"
            echo ""
            echo '```hcl'
            head -n 400 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
